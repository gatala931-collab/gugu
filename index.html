    <meta property="og:description" content="Track local foods, nutrition goals and smart meal suggestions with Nutry AI." />

    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <script>
      (function() {
        const origErr = console.error;
        console.error = function(...args) {
          if (typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].includes('WebSocket') || args[0].includes('dev-ready'))) {
            return;
          }
          origErr.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function(event) {
          const reason = String(event.reason?.message || event.reason || '');
          if (reason.includes('WebSocket') || reason.includes('[vite]')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(event) {
          const msg = String(event.message || '');
          if (msg.includes('WebSocket') || msg.includes('[vite]')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
